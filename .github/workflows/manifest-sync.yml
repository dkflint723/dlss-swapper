name: Manifest sync

# The swappable dll list is generated by a separate repository and copied into this one by hand,
# which means the copy the app ships with goes stale silently and a brand new dll type arrives with
# nobody told. This checks daily, opens a pull request when the manifest moved, and says in the body
# whether what arrived is data or something that needs code.
#
# The tests run *here* rather than being left to tests.yml on the pull request. A pull request opened
# using GITHUB_TOKEN deliberately does not trigger other workflows, so the checks would never run on
# it; asking for them here is what makes the answer arrive with the pull request instead of after
# someone pushes to it.

on:
  schedule:
    # Daily, a little after the hour. The builder repo publishes on its own schedule and nothing here
    # is urgent — a running app already re-fetches the live manifest hourly, so this is about the
    # bundled copy and about noticing a new dll type, neither of which is worth a tighter loop.
    - cron: '17 7 * * *'
  workflow_dispatch:

# Needed to push the branch and open the pull request. Note that "Allow GitHub Actions to create and
# approve pull requests" must also be enabled in the repository's Actions settings, or the create
# step fails with a permissions error no token change can fix.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manifest-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automated/manifest-sync

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.202'

    - name: Fetch the manifest and report what changed
      shell: pwsh
      run: ./extras/sync_manifest.ps1 -SummaryPath "${{ runner.temp }}/manifest-summary.md"

    - name: Check whether either copy actually moved
      id: changed
      run: |
        if [ -n "$(git status --porcelain -- src/Assets/static_manifest.json docs/manifest.json)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "The manifest matches the copy already committed. Nothing to do."
        fi

    - name: Build the core tests
      if: steps.changed.outputs.changed == 'true'
      run: dotnet build "tests/DLSS.Swapper.Core.Tests/DLSS.Swapper.Core.Tests.csproj" -c Debug

    # The authoritative answer to "did a new dll type arrive", using the real registry rather than
    # the script's regex over it. Run on its own, because the whole suite's outcome cannot tell a new
    # dll type apart from any unrelated red test — it once reported an off-Windows path bug in the
    # test double as a new dll type, with the title and body to match. Allowed to fail so that the
    # pull request still gets opened when it does — the failure is the thing worth seeing, and seeing
    # it needs the branch to exist. The job is failed at the end instead.
    - name: Check the registry covers the new manifest
      id: registry
      if: steps.changed.outputs.changed == 'true'
      continue-on-error: true
      run: dotnet test "tests/DLSS.Swapper.Core.Tests/DLSS.Swapper.Core.Tests.csproj" -c Debug --no-build --filter "FullyQualifiedName~EveryPopulatedManifestKey_IsHandledByTheRegistry" --logger "console;verbosity=normal"

    # The rest of the suite, so a real regression on the branch is still caught. Kept separate from
    # the check above, and reported separately, so the two can never be confused for one another.
    - name: Run the rest of the core tests
      id: tests
      if: steps.changed.outputs.changed == 'true'
      continue-on-error: true
      run: dotnet test "tests/DLSS.Swapper.Core.Tests/DLSS.Swapper.Core.Tests.csproj" -c Debug --no-build --filter "FullyQualifiedName!~EveryPopulatedManifestKey_IsHandledByTheRegistry" --logger "console;verbosity=normal"

    - name: Open or update the pull request
      if: steps.changed.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Only ever these two files. The working tree is otherwise untouched, but staging by path is
        # the repo's standing rule for the manifest and it costs nothing to keep to it here.
        git add src/Assets/static_manifest.json docs/manifest.json

        SUMMARY_PATH="${{ runner.temp }}/manifest-summary.md"

        if [ "${{ steps.registry.outcome }}" = "failure" ]; then
          HEADLINE="A new dll type arrived and the app has no row for it"
        else
          HEADLINE="New dll versions"
        fi

        git commit -m "Take the manifest the builder is publishing now" -m "$(cat "$SUMMARY_PATH")"

        # A single long lived branch, force pushed, so repeated runs update one pull request rather
        # than opening a new one every day.
        git push --force origin "HEAD:${SYNC_BRANCH}"

        BODY_PATH="${{ runner.temp }}/pr-body.md"
        {
          echo "Opened by the \`Manifest sync\` workflow from the [manifest builder repository](https://github.com/beeradmoore/dlss-swapper-manifest-builder)."
          echo
          cat "$SUMMARY_PATH"
          echo
          if [ "${{ steps.registry.outcome }}" = "failure" ]; then
            echo "### A new dll type arrived"
            echo
            echo "\`DllTypesTests.EveryPopulatedManifestKey_IsHandledByTheRegistry\` failed, which is this"
            echo "workflow working as intended: the manifest carries something the app cannot show."
            echo "Add the \`DllTypeDefinition\` before merging, or merge the data and track the type separately."
          else
            echo "Every dll type in this manifest already has a row in \`DllTypes.All\`, so what arrived is new versions of dll types the app already handles."
          fi

          if [ "${{ steps.tests.outcome }}" = "failure" ]; then
            echo
            echo "### Unrelated core tests are red"
            echo
            echo "Core tests other than the registry check are failing on this branch. That is a broken"
            echo "test or a regression, not a statement about the manifest — read it separately from the"
            echo "line above."
          fi
        } > "$BODY_PATH"

        EXISTING=$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')

        if [ -n "$EXISTING" ]; then
          gh pr edit "$EXISTING" --title "$HEADLINE" --body-file "$BODY_PATH"
          echo "Updated pull request #${EXISTING}."
        else
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "${SYNC_BRANCH}" --title "$HEADLINE" --body-file "$BODY_PATH"
        fi

    # Last, so the pull request above exists to look at. Each cause is reported on its own: a red
    # registry check means the manifest needs code, anything else red is an ordinary broken test.
    - name: Fail the run if the manifest needs code
      if: steps.changed.outputs.changed == 'true' && (steps.registry.outcome == 'failure' || steps.tests.outcome == 'failure')
      run: |
        if [ "${{ steps.registry.outcome }}" = "failure" ]; then
          echo "::error::The manifest carries a dll type DllTypes.All has no row for. See the pull request on ${SYNC_BRANCH}."
        fi
        if [ "${{ steps.tests.outcome }}" = "failure" ]; then
          echo "::error::Core tests unrelated to the registry are failing on ${SYNC_BRANCH}. This is a broken test, not a new dll type."
        fi
        exit 1
